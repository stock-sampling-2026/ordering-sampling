// カメラ・バーコード読み取り

function normalizeJan(value) {
  return String(value).trim().replace(
    /[０-９]/g,
    character => String(character.charCodeAt(0) - 0xFF10)
  );
}

function isValidJan(value) {
  if (
    !/^(?:\d{8}|\d{13})$/.test(value) ||
    /^0+$/.test(value)
  ) return false;

  let sum = 0;

  for (
    let i = value.length - 2, weight = 3;
    i >= 0;
    i--, weight = weight === 3 ? 1 : 3
  ) {
    sum += Number(value[i]) * weight;
  }

  return (10 - sum % 10) % 10 === Number(value[value.length - 1]);
}

// 有効な8桁JANだけを13文字へ統一。
// 任意の桁不足や誤読をゼロで埋めて受け入れることはしない。
function normalizeJanForRecord(value) {
  const code = normalizeJan(value);
  return isValidJan(code) ? code.padStart(13,'0') : '';
}

const janScanner = {
  generation:0,
  decodeEpoch:0,
  active:false,
  ready:false,
  stream:null,
  decoder:null,
  pending:null,
  restartRequested:false,
  userPaused:true,
  blocked:false,
  timer:null,
  readingTask:null,
  previousCode:'',
  previousAt:0,
  streak:0,
  lastFrameTime:-1,
  lastFrameAt:0,
  startedAt:0,
  message:'入力する項目を選んで「開始・カメラ起動」を押してください。',
  problem:false,
  scanHint:''
};

let zxingLoadPromise = null;

const cameraPreferences = {
  deviceId:'',
  quality:'high'
};

let cameraControls = null;

function getJanVideoConstraints() {
  const high = cameraPreferences.quality === 'high';

  const constraints = {
    width:{ideal:high ? 3840 : 1920},
    height:{ideal:high ? 2160 : 1080},
    frameRate:{ideal:30}
  };

  if (cameraPreferences.deviceId) {
    constraints.deviceId = {exact:cameraPreferences.deviceId};
  } else {
    constraints.facingMode = {ideal:'environment'};
  }

  try {
    if (navigator.mediaDevices.getSupportedConstraints().resizeMode) {
      constraints.resizeMode = {ideal:'none'};
    }
  } catch (_) {
    // 任意のカメラ機能。
  }

  return constraints;
}

function readJanTrackSettings(track) {
  try {
    return track.getSettings() || {};
  } catch (_) {
    return {};
  }
}

function isCurrentJanControl(control) {
  return !!control &&
    cameraControls === control &&
    janScanner.active &&
    control.token === janScanner.generation &&
    janScanner.stream &&
    janScanner.stream.getVideoTracks().includes(control.track);
}

function janCameraRange(range) {
  return !!range &&
    Number.isFinite(range.min) &&
    Number.isFinite(range.max) &&
    range.max > range.min;
}

function janTorchSupported(capabilities) {
  return capabilities.torch === true ||
    (
      Array.isArray(capabilities.torch) &&
      capabilities.torch.includes(true)
    );
}

function refreshCameraControls() {
  const control = cameraControls;

  if (!isCurrentJanControl(control)) {
    [
      'cameraZoomRow',
      'cameraManualFocusRow',
      'cameraFocus',
      'cameraTorch'
    ].forEach(id => {
      el(id).hidden = true;
    });

    el('cameraDevice').disabled = !!janScanner.pending || !!sending;
    el('cameraQuality').disabled = !!janScanner.pending || !!sending;
    el('cameraInfo').textContent =
      'カメラ停止中。設定は次の起動時に反映されます。';

    return;
  }

  control.settings = readJanTrackSettings(control.track);

  const capabilities = control.capabilities;
  const settings = control.settings;
  const modes = Array.isArray(capabilities.focusMode)
    ? capabilities.focusMode
    : [];

  const canAdjust =
    typeof control.track.applyConstraints === 'function';
  const disabled = !!control.busy || !!sending;

  el('cameraQuality').value = cameraPreferences.quality;
  el('cameraQuality').disabled = disabled;
  el('cameraDevice').disabled = disabled;

  el('cameraFocus').hidden =
    !canAdjust ||
    !modes.some(
      mode => mode === 'continuous' || mode === 'single-shot'
    );
  el('cameraFocus').disabled = disabled;

  el('cameraTorch').hidden =
    !canAdjust || !janTorchSupported(capabilities);
  el('cameraTorch').disabled = disabled;

  const torch = settings.torch === undefined
    ? !!control.adjustments.torch
    : !!settings.torch;

  el('cameraTorch').setAttribute('aria-pressed',String(torch));
  el('cameraTorch').textContent = torch ? 'ライト ON' : 'ライト OFF';

  const configureRange = (
    id,rowId,valueId,range,value,suffix
  ) => {
    const available = canAdjust && janCameraRange(range);
    el(rowId).hidden = !available;
    if (!available) return;

    const slider = el(id);

    slider.min = String(range.min);
    slider.max = String(range.max);
    slider.step = String(
      Number.isFinite(range.step) && range.step > 0
        ? range.step
        : (range.max - range.min) / 100
    );

    const current = Number.isFinite(value)
      ? Math.min(range.max,Math.max(range.min,value))
      : range.min;

    slider.value = String(current);
    slider.disabled = disabled;

    el(valueId).textContent =
      String(Number(current.toFixed(2))) + suffix;
  };

  configureRange(
    'cameraZoom',
    'cameraZoomRow',
    'cameraZoomValue',
    capabilities.zoom,
    settings.zoom === undefined
      ? control.adjustments.zoom
      : settings.zoom,
    '×'
  );

  configureRange(
    'cameraManualFocus',
    'cameraManualFocusRow',
    'cameraFocusValue',
    modes.includes('manual') ? capabilities.focusDistance : null,
    settings.focusDistance === undefined
      ? control.adjustments.focusDistance
      : settings.focusDistance,
    ''
  );

  const video = el('janVideo');
  const width = video.videoWidth || settings.width;
  const height = video.videoHeight || settings.height;

  const modeNames = {
    'continuous':'自動ピント',
    'single-shot':'1回ピント調整',
    'manual':'手動ピント',
    'none':'ピント制御なし'
  };

  el('cameraInfo').textContent =
    (
      width && height
        ? '実映像 ' + width + ' × ' + height + ' px'
        : '映像の画質を確認中'
    ) +
    ' ／ ' +
    (modeNames[settings.focusMode] || 'ピント設定は端末側');
}

async function refreshJanCameraDevices(control) {
  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.enumerateDevices
  ) return;

  try {
    const devices = (
      await navigator.mediaDevices.enumerateDevices()
    ).filter(
      device => device.kind === 'videoinput' && device.deviceId
    );

    if (!isCurrentJanControl(control)) return;

    const select = el('cameraDevice');
    select.replaceChildren();

    const automatic = document.createElement('option');
    automatic.value = '';
    automatic.textContent = '背面（自動）';
    select.appendChild(automatic);

    devices.forEach((device,index) => {
      const option = document.createElement('option');
      option.value = device.deviceId;
      option.textContent = device.label || 'カメラ ' + (index + 1);
      select.appendChild(option);
    });

    select.value = cameraPreferences.deviceId;
    el('cameraDeviceRow').hidden = devices.length < 2;
  } catch (_) {
    // カメラ一覧が取得できなくても現在の映像は使い続ける。
  }
}

async function applyJanCameraChange(patch,successText = '') {
  const control = cameraControls;

  if (
    !isCurrentJanControl(control) ||
    typeof control.track.applyConstraints !== 'function' ||
    sending
  ) return false;

  const requested = {...patch};

  control.busy++;
  resetJanReading();
  refreshCameraControls();

  const task = control.queue.catch(() => {}).then(async () => {
    if (!isCurrentJanControl(control)) return false;

    const next = {...control.adjustments,...requested};

    if (next.focusMode && next.focusMode !== 'manual') {
      delete next.focusDistance;
    }

    // 他の調整値や解像度・カメラ指定を失わないようにまとめて適用。
    await control.track.applyConstraints({
      ...control.baseConstraints,
      advanced:[next]
    });

    if (!isCurrentJanControl(control)) return false;

    control.adjustments = next;
    control.settings = readJanTrackSettings(control.track);

    const ignored = Object.keys(requested).some(key => {
      if (control.settings[key] === undefined) return false;

      return typeof requested[key] === 'number'
        ? Math.abs(control.settings[key] - requested[key]) > 0.05
        : control.settings[key] !== requested[key];
    });

    el('cameraControlStatus').textContent = ignored
      ? '端末が設定を反映していない項目があります。映像を確認してください。'
      : successText;

    return true;
  }).catch(() => {
    if (isCurrentJanControl(control)) {
      el('cameraControlStatus').textContent =
        'この設定は適用できませんでした。現在の映像で読み取りを続けられます。';
    }
    return false;
  }).finally(() => {
    control.busy = Math.max(0,control.busy - 1);

    if (isCurrentJanControl(control)) {
      refreshCameraControls();
      if (!control.busy) resetJanReading();
    }
  });

  control.queue = task;
  return task;
}

async function configureJanTrack(track,token,baseConstraints) {
  let capabilities = {};

  try {
    capabilities = track.getCapabilities() || {};
  } catch (_) {
    // この場合は端末側の自動調整に任せる。
  }

  const control = {
    track,
    token,
    capabilities,
    settings:readJanTrackSettings(track),
    baseConstraints,
    adjustments:{},
    queue:Promise.resolve(),
    busy:0
  };

  cameraControls = control;
  el('cameraControlStatus').textContent = '';

  refreshCameraControls();
  void refreshJanCameraDevices(control);

  const modes = Array.isArray(capabilities.focusMode)
    ? capabilities.focusMode
    : [];

  if (modes.includes('continuous')) {
    await applyJanCameraChange({focusMode:'continuous'});
  } else if (modes.includes('single-shot')) {
    await applyJanCameraChange({focusMode:'single-shot'});
  }
}

async function requestJanFocus() {
  const control = cameraControls;
  if (!isCurrentJanControl(control)) return;

  const modes = control.capabilities.focusMode || [];
  const mode =
    modes.includes('continuous') ? 'continuous' :
    modes.includes('single-shot') ? 'single-shot' :
    '';

  if (mode) {
    await applyJanCameraChange(
      {focusMode:mode},
      '自動ピントの設定を要求しました。映像が鮮明になる距離で合わせてください。'
    );
  }
}

async function switchJanCamera() {
  if (sending || janScanner.pending) return;

  cameraPreferences.deviceId = el('cameraDevice').value;
  cameraPreferences.quality =
    el('cameraQuality').value === 'standard'
      ? 'standard'
      : 'high';

  if (janScanner.userPaused && !janScanner.active) return;

  janScanner.userPaused = false;
  janScanner.blocked = false;

  stopJanCamera();
  await startJanCamera(true);
}

function setJanStatus(message,problem = false) {
  janScanner.message = message;
  janScanner.problem = problem;
  updateCameraUI();
}

function updateCameraUI() {
  const waiting = janScanner.active || janScanner.restartRequested;
  const live =
    janScanner.active &&
    janScanner.ready &&
    !!janScanner.stream;

  const placeholder = el('cameraPlaceholder');
  const toggle = el('cameraToggle');

  let state = 'カメラ停止中';
  let hint = janScanner.message;

  placeholder.hidden = live;

  el('cameraOptions').hidden =
    !live && !janScanner.startedAt;

  el('cameraDevice').disabled =
    !!janScanner.pending ||
    !!sending ||
    !!(cameraControls && cameraControls.busy);

  el('cameraQuality').disabled = el('cameraDevice').disabled;

  if (live) {
    if (!janScanner.decoder) {
      state = '映像表示中';
      hint = hint || '読み取り機能を準備しています。';
    } else if (
      phase === 'ready' &&
      !sending &&
      (
        el('cameraOptions').open ||
        (cameraControls && cameraControls.busy)
      )
    ) {
      state = 'カメラ調整中';
      hint = '調整を閉じるとJANの読み取りを再開します。';
    } else if (phase === 'ready' && !sending) {
      state = 'JAN読み取り中';
      hint =
        janScanner.scanHint ||
        hint ||
        '左右の白い余白を含めて枠内へ。ぼける時は少し離してください。';
    } else {
      state = sending || phase === 'sending'
        ? '送信中・映像表示'
        : '映像表示・読み取り待機';

      const pausedHints = {
        setup:'入力項目を選び、開始してください。',
        input:'入力中はバーコードの読み取りを止めています。',
        paused:'入力を再開するか、次の商品へ進んでください。',
        review:'内容を確認して記録してください。',
        sending:'送信処理中です。'
      };

      hint = hint ||
        pausedHints[phase] ||
        'バーコードの読み取りを待機しています。';
    }
  } else if (waiting) {
    state = janScanner.pending
      ? 'カメラ許可を確認中'
      : 'カメラ起動中';

    placeholder.textContent = janScanner.pending
      ? 'カメラの許可を確認しています'
      : 'カメラを準備しています';

    hint = hint ||
      '確認が出たらカメラを許可してください。JANの手入力も利用できます。';
  } else {
    placeholder.textContent = janScanner.blocked
      ? 'カメラを利用できません'
      : 'カメラ停止中';

    hint = hint ||
      'カメラを起動するか、JANを手入力してください。';
  }

  el('cameraState').textContent = state;

  const hintNode = el('cameraHint');
  if (hintNode.textContent !== hint) hintNode.textContent = hint;

  hintNode.classList.toggle('problem',janScanner.problem);
  toggle.disabled = !!sending;

  const label =
    waiting ? 'カメラ停止' :
    janScanner.blocked ? 'カメラ再試行' :
    janScanner.userPaused && janScanner.startedAt > 0
      ? 'カメラ再開'
      : 'カメラ起動';

  if (toggle.textContent !== label) toggle.textContent = label;
  toggle.setAttribute('aria-label',label);
}

function disposeJanDecoder(decoder) {
  if (!decoder || decoder.disposed) return;
  decoder.disposed = true;

  if (decoder.compatibility) {
    disposeJanDecoder(decoder.compatibility);
    decoder.compatibility = null;
  }

  if (decoder.reader) {
    try {
      decoder.reader.reset();
    } catch (_) {}
  }

  if (decoder.labelReader) {
    try {
      decoder.labelReader.reset();
    } catch (_) {}
  }
}

function clearJanStreak() {
  janScanner.previousCode = '';
  janScanner.previousAt = 0;
  janScanner.streak = 0;
}

function canReadJan(token,epoch) {
  return janScanner.active &&
    janScanner.ready &&
    !!janScanner.decoder &&
    token === janScanner.generation &&
    epoch === janScanner.decodeEpoch &&
    phase === 'ready' &&
    !sending &&
    !document.hidden &&
    !el('cameraOptions').open &&
    !(cameraControls && cameraControls.busy);
}

function scheduleJanFrame(token,epoch,delay = 180) {
  if (!canReadJan(token,epoch)) return;

  clearTimeout(janScanner.timer);

  janScanner.timer = setTimeout(() => {
    janScanner.timer = null;
    readJanFrame(token,epoch);
  },delay);
}

function resetJanReading() {
  janScanner.decodeEpoch++;

  clearTimeout(janScanner.timer);
  janScanner.timer = null;

  clearJanStreak();

  janScanner.lastFrameTime = -1;
  janScanner.lastFrameAt = Date.now();
  janScanner.scanHint = '';

  if (
    janScanner.active &&
    janScanner.ready &&
    janScanner.decoder
  ) {
    janScanner.message = '';
    janScanner.problem = false;
  }

  updateCameraUI();

  scheduleJanFrame(
    janScanner.generation,
    janScanner.decodeEpoch,
    0
  );
}

function stopJanCamera(message = '',problem = false) {
  // 未解決のカメラ許可要求は保持し、要求の重複を防ぐ。
  janScanner.generation++;
  janScanner.decodeEpoch++;
  janScanner.active = false;
  janScanner.ready = false;
  janScanner.restartRequested = false;

  clearTimeout(janScanner.timer);
  janScanner.timer = null;

  clearJanStreak();
  janScanner.scanHint = '';

  const stream = janScanner.stream;

  janScanner.stream = null;
  cameraControls = null;

  refreshCameraControls();

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  const video = el('janVideo');
  video.pause();
  video.srcObject = null;

  disposeJanDecoder(janScanner.decoder);
  janScanner.decoder = null;
  janScanner.message = message;
  janScanner.problem = problem;

  updateCameraUI();
}

function loadZxing() {
  if (window.ZXing && window.ZXing.MultiFormatReader) {
    return Promise.resolve(window.ZXing);
  }

  if (zxingLoadPromise) return zxingLoadPromise;

  zxingLoadPromise = new Promise((resolve,reject) => {
    const script = document.createElement('script');
    let finished = false;

    const finish = error => {
      if (finished) return;
      finished = true;

      clearTimeout(timeout);
      script.onload = null;
      script.onerror = null;

      if (error) {
        script.remove();
        reject(error);
      } else {
        resolve(window.ZXing);
      }
    };

    const timeout = setTimeout(
      () => finish({name:'JanLibraryError'}),
      15000
    );

    script.src =
      'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';

    script.async = true;
    script.integrity =
      'sha384-BzBxP10ZE72aitqj5UMmUsbKFliP/DZqA8Wq+BNNhlIJDGoEd1tpkMYXOg9+n6sB';

    script.crossOrigin = 'anonymous';
    script.referrerPolicy = 'no-referrer';

    script.onload = () => {
      finish(
        window.ZXing && window.ZXing.MultiFormatReader
          ? null
          : {name:'JanLibraryError'}
      );
    };

    script.onerror = () => finish({name:'JanLibraryError'});
    document.head.appendChild(script);
  }).catch(error => {
    zxingLoadPromise = null;
    throw error;
  });

  return zxingLoadPromise;
}

const JAN_NATIVE_FORMATS = [
  'ean_13',
  'ean_8',
  'code_128',
  'code_39',
  'itf'
];

async function createJanDecoder(preferNative = true) {
  if (preferNative && 'BarcodeDetector' in window) {
    try {
      const supported =
        await window.BarcodeDetector.getSupportedFormats();

      if (
        ['ean_13','ean_8'].every(
          format => supported.includes(format)
        )
      ) {
        const formats = JAN_NATIVE_FORMATS.filter(
          format => supported.includes(format)
        );

        return {
          kind:'native',
          detector:new window.BarcodeDetector({formats}),
          formats,
          disposed:false,
          misses:0,
          compatibility:null,
          compatibilityPromise:null,
          compatibilityAttempted:false,
          compatibilityFailed:false,
          diagnostic:''
        };
      }
    } catch (_) {
      // 互換デコーダーへ切り替える。
    }
  }

  const Z = await loadZxing();

  const eanFormats = [
    Z.BarcodeFormat.EAN_13,
    Z.BarcodeFormat.EAN_8
  ];

  const allFormats = [
    ...eanFormats,
    Z.BarcodeFormat.CODE_128,
    Z.BarcodeFormat.CODE_39,
    Z.BarcodeFormat.ITF
  ];

  const makeReader = formats => {
    const hints = new Map([
      [Z.DecodeHintType.POSSIBLE_FORMATS,formats],
      [Z.DecodeHintType.TRY_HARDER,true]
    ]);

    const reader = new Z.MultiFormatReader();
    reader.setHints(hints);
    return reader;
  };

  return {
    kind:'zxing',
    Z,
    reader:makeReader(eanFormats),
    labelReader:makeReader(allFormats),
    allFormats,
    variant:0,
    disposed:false,
    diagnostic:''
  };
}

function prepareJanCompatibility(decoder) {
  if (decoder.disposed || decoder.compatibilityAttempted) return;

  decoder.compatibilityAttempted = true;

  decoder.compatibilityPromise = createJanDecoder(false)
    .then(fallback => {
      if (decoder.disposed) {
        disposeJanDecoder(fallback);
        return;
      }
      decoder.compatibility = fallback;
    })
    .catch(() => {
      if (!decoder.disposed) {
        decoder.compatibilityFailed = true;
      }
    })
    .finally(() => {
      decoder.compatibilityPromise = null;
    });
}

function collectDecodedJan(decoder,values) {
  const accepted = [];

  for (const value of values) {
    const code = normalizeJan(value);

    // プライスカードに独自の商品番号が入っている場合もある。
    // JANの部分切り出しや桁数の推測は行わない。
    if (isValidJan(code)) {
      accepted.push(code);
    } else {
      decoder.diagnostic =
        'バーコードは読めましたが、JANの桁数・チェックが一致しません。カードのJANを確認してください。';
    }
  }

  return [...new Set(accepted)];
}

function janVariantSource(Z,source,variant) {
  if (variant === 0) return source;
  if (variant === 2) return source.invert();

  const rotate = variant === 4;

  const transformed = new class extends Z.LuminanceSource {
    constructor() {
      super(
        rotate ? source.getHeight() : source.getWidth(),
        rotate ? source.getWidth() : source.getHeight()
      );
    }

    getRow(y,row) {
      const width = this.getWidth();

      if (!row || row.length < width) {
        row = new Uint8ClampedArray(width);
      }

      if (rotate) {
        const pixels = source.getMatrix();
        const originalWidth = source.getWidth();

        for (let x = 0; x < width; x++) {
          row[x] =
            pixels[x * originalWidth + originalWidth - 1 - y];
        }
      } else {
        row = source.getRow(y,row);

        let low = 255;
        let high = 0;

        for (let x = 0; x < width; x++) {
          low = Math.min(low,row[x]);
          high = Math.max(high,row[x]);
        }

        // ほぼ一様な画像のノイズを過剰に強調しない。
        if (high - low >= 12 && high - low < 220) {
          const scale = 255 / (high - low);

          for (let x = 0; x < width; x++) {
            row[x] = Math.round((row[x] - low) * scale);
          }
        }
      }

      return row;
    }

    getMatrix() {
      const width = this.getWidth();
      const height = this.getHeight();
      const matrix = new Uint8ClampedArray(width * height);

      let row = null;

      for (let y = 0; y < height; y++) {
        row = this.getRow(y,row);
        matrix.set(row.subarray(0,width),y * width);
      }

      return matrix;
    }

    invert() {
      return new Z.InvertedLuminanceSource(this);
    }
  }();

  return variant === 3 ? transformed.invert() : transformed;
}

function tryJanZxing(decoder,reader,source) {
  const {Z} = decoder;

  try {
    const bitmap = new Z.BinaryBitmap(
      new Z.GlobalHistogramBinarizer(source)
    );

    const result = reader.decodeWithState(bitmap);

    return decoder.allFormats.includes(result.getBarcodeFormat())
      ? collectDecodedJan(decoder,[result.getText()])
      : [];
  } catch (error) {
    if (
      error instanceof Z.NotFoundException ||
      error instanceof Z.ChecksumException ||
      error instanceof Z.FormatException
    ) {
      return [];
    }
    throw error;
  } finally {
    reader.reset();
  }
}

async function decodeJanCanvas(decoder,canvas) {
  if (!decoder || decoder.disposed) return [];

  decoder.diagnostic = '';

  if (decoder.kind === 'native') {
    const found = await decoder.detector.detect(canvas);
    if (decoder.disposed) return [];

    const codes = collectDecodedJan(
      decoder,
      found.filter(
        item => decoder.formats.includes(item.format)
      ).map(item => item.rawValue)
    );

    if (codes.length) {
      decoder.misses = 0;
      return codes;
    }

    decoder.misses = Math.min(4,decoder.misses + 1);

    if (decoder.misses >= 4) {
      prepareJanCompatibility(decoder);
    }

    if (decoder.compatibility) {
      try {
        const compatible = await decodeJanCanvas(
          decoder.compatibility,
          canvas
        );

        decoder.diagnostic =
          decoder.compatibility.diagnostic || decoder.diagnostic;

        return compatible;
      } catch (_) {
        disposeJanDecoder(decoder.compatibility);
        decoder.compatibility = null;
        decoder.compatibilityFailed = true;
      }
    }

    return [];
  }

  const {Z} = decoder;

  const luminance =
    new Z.HTMLCanvasElementLuminanceSource(canvas).getMatrix();

  const source = new Z.RGBLuminanceSource(
    luminance,
    canvas.width,
    canvas.height
  );

  // 先にEANを探し、別の番号を持つラベルに隠されにくくする。
  const ean = tryJanZxing(decoder,decoder.reader,source);
  if (ean.length) return ean;

  // 追加の解析は1フレームにつき1回。
  // 成功した方法は次フレームでも使い、2回確認につなげる。
  const extra = tryJanZxing(
    decoder,
    decoder.labelReader,
    janVariantSource(Z,source,decoder.variant)
  );

  if (!extra.length) {
    decoder.variant = (decoder.variant + 1) % 5;
  }

  return extra;
}

function captureJanFrame() {
  const video = el('janVideo');
  const viewport = el('cameraViewport');
  const canvas = el('janCanvas');

  const ratio =
    viewport.clientWidth && viewport.clientHeight
      ? viewport.clientWidth / viewport.clientHeight
      : 3.5;

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  // object-fit:coverで見えている範囲と一致させる。
  // 赤い線は映像とは別要素なので解析画像に入らない。
  const sw = Math.min(vw,vh * ratio);
  const sh = sw / ratio;
  const sx = (vw - sw) / 2;
  const sy = (vh - sh) / 2;

  // 元映像の画素を可能な限り残す。低解像度映像の拡大はしない。
  const scale = Math.min(1,3840 / sw,2160 / sh);
  const cw = Math.max(1,Math.floor(sw * scale));
  const ch = Math.max(1,Math.floor(sh * scale));

  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;

  const context = canvas.getContext(
    '2d',
    {willReadFrequently:true}
  );

  if (!context) throw {name:'JanCaptureError'};

  context.imageSmoothingEnabled = false;
  context.drawImage(video,sx,sy,sw,sh,0,0,cw,ch);

  return canvas;
}

async function readJanFrame(token,epoch) {
  if (!canReadJan(token,epoch)) return;

  if (
    janScanner.readingTask &&
    janScanner.readingTask.generation === token
  ) {
    scheduleJanFrame(token,epoch,80);
    return;
  }

  const task = {generation:token,epoch};
  janScanner.readingTask = task;

  const video = el('janVideo');

  try {
    if (
      video.readyState >= 2 &&
      video.videoWidth > 0 &&
      video.videoHeight > 0 &&
      video.currentTime !== janScanner.lastFrameTime
    ) {
      janScanner.lastFrameTime = video.currentTime;
      janScanner.lastFrameAt = Date.now();

      const canvas = captureJanFrame();
      let decoder = janScanner.decoder;
      let codes;

      try {
        codes = await decodeJanCanvas(decoder,canvas);
      } catch (error) {
        if (!canReadJan(token,epoch)) return;
        if (decoder.kind !== 'native') throw error;

        setJanStatus('互換用の読み取り機能を準備しています。');

        const fallback = await createJanDecoder(false);

        if (!canReadJan(token,epoch)) {
          disposeJanDecoder(fallback);
          return;
        }

        disposeJanDecoder(decoder);
        janScanner.decoder = fallback;
        decoder = fallback;

        clearJanStreak();
        setJanStatus('');

        codes = await decodeJanCanvas(decoder,canvas);
      }

      if (!canReadJan(token,epoch)) return;

      const unique = [
        ...new Set(
          codes.map(normalizeJanForRecord).filter(Boolean)
        )
      ];

      const now = Date.now();

      if (unique.length === 1) {
        const code = unique[0];

        janScanner.scanHint = '';

        janScanner.streak =
          code === janScanner.previousCode &&
          now - janScanner.previousAt < 4000
            ? janScanner.streak + 1
            : 1;

        janScanner.previousCode = code;
        janScanner.previousAt = now;

        if (janScanner.streak >= 2) {
          clearJanStreak();

          if (
            startSample(code) === false &&
            canReadJan(token,epoch)
          ) {
            janScanner.scanHint =
              '入力を開始できませんでした。画面の案内を確認してください。';
          }
        }
      } else {
        clearJanStreak();

        janScanner.scanHint = unique.length > 1
          ? 'バーコードを1つだけ枠内に入れてください。'
          : (decoder.diagnostic || '');
      }

      updateCameraUI();
    } else if (
      Date.now() - janScanner.lastFrameAt > 15000
    ) {
      throw {name:'JanCaptureError'};
    }
  } catch (error) {
    if (canReadJan(token,epoch)) {
      janScanner.blocked = true;
      stopJanCamera(cameraErrorText(error),true);
    }
  } finally {
    if (janScanner.readingTask === task) {
      janScanner.readingTask = null;
    }

    scheduleJanFrame(token,epoch);
  }
}

function cameraErrorText(error) {
  switch (error && error.name) {
    case 'JanSecureError':
      return 'HTTPSの公開ページでカメラを利用してください。JANの手入力も利用できます。';

    case 'JanPolicyError':
      return '埋め込み画面ではカメラが許可されていません。公開URLをブラウザで直接開くか、JANを手入力してください。';

    case 'JanUnavailableError':
      return 'この画面ではカメラを利用できません。公開URLをChromeやSafariで開くか、JANを手入力してください。';

    case 'JanAutoplayError':
      return '映像を自動で開始できません。「カメラ再試行」を押すか、JANを手入力してください。';

    case 'NotAllowedError':
    case 'PermissionDeniedError':
    case 'SecurityError':
      return 'カメラが許可されていません。サイトのカメラ設定を確認し「カメラ再試行」を押すか、JANを手入力してください。';

    case 'NotFoundError':
    case 'DevicesNotFoundError':
      return '利用できるカメラが見つかりません。JANを手入力してください。';

    case 'NotReadableError':
    case 'TrackStartError':
      return 'カメラを開始できません。ほかのカメラアプリを閉じて再試行するか、JANを手入力してください。';

    case 'OverconstrainedError':
      return 'この端末ではカメラの条件を満たせません。別のブラウザで開くか、JANを手入力してください。';

    case 'JanLibraryError':
      return '読み取り機能を読み込めません。通信環境を確認して再試行するか、JANを手入力してください。';

    case 'JanCaptureError':
      return 'カメラ映像を取得できません。カメラを再試行するか、JANを手入力してください。';

    default:
      return '読み取りを続けられません。カメラを再試行するか、JANを手入力してください。';
  }
}

function mayRestartJanCamera() {
  if (
    !janScanner.restartRequested ||
    janScanner.pending ||
    janScanner.active ||
    janScanner.userPaused ||
    janScanner.blocked ||
    document.hidden
  ) return;

  janScanner.restartRequested = false;
  void startJanCamera(false);
}

async function startJanCamera(manual = false) {
  if (
    (manual && sending) ||
    document.hidden ||
    janScanner.userPaused ||
    janScanner.active
  ) return;

  if (!manual && janScanner.blocked) {
    updateCameraUI();
    return;
  }

  if (manual) janScanner.blocked = false;

  if (janScanner.pending) {
    janScanner.restartRequested = true;
    setJanStatus(
      '先に開いたカメラの許可確認を待っています。JANの手入力も利用できます。'
    );
    return;
  }

  stopJanCamera();

  const token = janScanner.generation;

  janScanner.active = true;
  janScanner.startedAt = Date.now();
  janScanner.lastFrameAt = janScanner.startedAt;
  janScanner.lastFrameTime = -1;

  setJanStatus(
    'カメラを準備しています。確認が出たら許可してください。JANの手入力も利用できます。'
  );

  let request = null;

  try {
    if (!window.isSecureContext) {
      throw {name:'JanSecureError'};
    }

    const policy =
      document.permissionsPolicy || document.featurePolicy;

    if (
      policy &&
      typeof policy.allowsFeature === 'function' &&
      !policy.allowsFeature('camera')
    ) {
      throw {name:'JanPolicyError'};
    }

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw {name:'JanUnavailableError'};
    }

    const videoConstraints = getJanVideoConstraints();

    request = navigator.mediaDevices.getUserMedia({
      audio:false,
      video:videoConstraints
    });

    janScanner.pending = request;
    updateCameraUI();

    let stream;

    try {
      stream = await request;
    } finally {
      if (janScanner.pending === request) {
        janScanner.pending = null;
      }
    }

    if (
      !janScanner.active ||
      token !== janScanner.generation ||
      document.hidden
    ) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }

    janScanner.stream = stream;

    stream.getVideoTracks().forEach(track => {
      track.addEventListener('ended',() => {
        if (
          janScanner.stream === stream &&
          janScanner.active
        ) {
          janScanner.blocked = true;
          stopJanCamera(
            'カメラが停止しました。「カメラ再試行」で再開できます。',
            true
          );
        }
      });
    });

    const video = el('janVideo');

    video.muted = true;
    video.playsInline = true;
    video.srcObject = stream;

    try {
      await video.play();
    } catch (error) {
      if (error && error.name === 'NotAllowedError') {
        throw {name:'JanAutoplayError'};
      }
      throw error;
    }

    if (
      !janScanner.active ||
      token !== janScanner.generation ||
      janScanner.stream !== stream
    ) return;

    janScanner.ready = true;

    await configureJanTrack(
      stream.getVideoTracks()[0],
      token,
      videoConstraints
    );

    if (
      !janScanner.active ||
      token !== janScanner.generation ||
      janScanner.stream !== stream
    ) return;

    setJanStatus('読み取り機能を準備しています。');

    const decoder = await createJanDecoder();

    if (
      !janScanner.active ||
      token !== janScanner.generation ||
      janScanner.stream !== stream
    ) {
      disposeJanDecoder(decoder);
      return;
    }

    janScanner.decoder = decoder;
    janScanner.blocked = false;

    resetJanReading();
  } catch (error) {
    const denied = error && [
      'NotAllowedError',
      'PermissionDeniedError',
      'SecurityError'
    ].includes(error.name);

    if (denied) {
      janScanner.blocked = true;
      janScanner.restartRequested = false;
    }

    if (token === janScanner.generation) {
      janScanner.blocked = true;
      stopJanCamera(cameraErrorText(error),true);
    } else if (
      denied &&
      !janScanner.userPaused &&
      !janScanner.active
    ) {
      setJanStatus(cameraErrorText(error),true);
    }
  } finally {
    if (request && janScanner.pending === request) {
      janScanner.pending = null;
    }

    updateCameraUI();
    mayRestartJanCamera();
  }
}

function toggleJanCamera() {
  if (sending) return;

  if (
    janScanner.active ||
    janScanner.restartRequested ||
    (janScanner.pending && !janScanner.userPaused)
  ) {
    janScanner.userPaused = true;
    stopJanCamera(
      'カメラを停止しました。入力は続けられます。'
    );
  } else {
    janScanner.userPaused = false;
    janScanner.blocked = false;
    void startJanCamera(true);
  }
}

el('cameraToggle').addEventListener('click',toggleJanCamera);

el('cameraOptions').addEventListener('toggle',() => {
  refreshCameraControls();
  resetJanReading();
});

el('janVideo').addEventListener(
  'resize',
  refreshCameraControls
);

el('cameraDevice').addEventListener('change',() => {
  void switchJanCamera();
});

el('cameraQuality').addEventListener('change',() => {
  void switchJanCamera();
});

el('cameraFocus').addEventListener('click',() => {
  void requestJanFocus();
});

el('cameraZoom').addEventListener('input',event => {
  el('cameraZoomValue').textContent =
    Number(event.target.value).toFixed(2) + '×';
});

el('cameraZoom').addEventListener('change',event => {
  if (
    cameraControls &&
    janCameraRange(cameraControls.capabilities.zoom)
  ) {
    void applyJanCameraChange(
      {zoom:Number(event.target.value)},
      'ズーム設定を要求しました。'
    );
  }
});

el('cameraManualFocus').addEventListener('input',event => {
  el('cameraFocusValue').textContent =
    String(Number(event.target.value));
});

el('cameraManualFocus').addEventListener('change',event => {
  if (
    cameraControls &&
    janCameraRange(cameraControls.capabilities.focusDistance)
  ) {
    void applyJanCameraChange(
      {
        focusMode:'manual',
        focusDistance:Number(event.target.value)
      },
      '手動ピントの設定を要求しました。'
    );
  }
});

el('cameraTorch').addEventListener('click',() => {
  if (
    cameraControls &&
    janTorchSupported(cameraControls.capabilities)
  ) {
    void applyJanCameraChange(
      {
        torch:
          el('cameraTorch').getAttribute('aria-pressed') !== 'true'
      },
      'ライト設定を要求しました。反射が増える時はOFFにしてください。'
    );
  }
});

document.addEventListener('visibilitychange',() => {
  if (document.hidden) {
    stopJanCamera(
      '画面を離れたためカメラを停止しました。'
    );
  } else if (
    !janScanner.userPaused &&
    !janScanner.blocked
  ) {
    void startJanCamera(false);
  }
});

window.addEventListener('pagehide',() => {
  stopJanCamera();
});

window.addEventListener('pageshow',() => {
  if (
    !document.hidden &&
    !janScanner.userPaused &&
    !janScanner.blocked
  ) {
    void startJanCamera(false);
  }
});

selectionChanged();
renderApp();
</script>
</body>
</html>
