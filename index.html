<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>サンプリング入力</title>
  <style>
    :root { --blue:#075cb5; --navy:#18446f; --ink:#243547; --muted:#5a6b7d; --line:#dce4ed; --bg:#f3f6fa; --red:#c33743; --green:#217448; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; padding:env(safe-area-inset-top) 0 calc(var(--dock-space,130px) + env(safe-area-inset-bottom)); background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; font-size:12px; line-height:1.4; }
    body.wizard-open { overflow:hidden; overscroll-behavior:none; }
    button,input,select { font:inherit; }
    button { cursor:pointer; touch-action:manipulation; }
    button:disabled { cursor:default; opacity:.45; }
    button:focus-visible,input:focus-visible { outline:2px solid #a9cef5; outline-offset:2px; }
    input[type="text"] { display:block; width:100%; min-width:0; height:44px; padding:6px 8px; border:1px solid #b8c6d5; border-radius:6px; background:#fff; color:var(--ink); font-size:16px; line-height:1.25; }
    input[aria-invalid="true"] { border:2px solid var(--red); }
    input[type="checkbox"],input[type="radio"] { flex:0 0 auto; width:18px; height:18px; margin:0; accent-color:var(--blue); }
    label { cursor:pointer; }
    .sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; padding:0; }
    .shell, #cameraPanel { width:100%; max-width:480px; margin:0 auto; padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left)); }
    .panel { margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .camera-viewport { position:relative; width:100%; height:auto; aspect-ratio:16 / 9; overflow:hidden; border-top:1px solid #466787; border-bottom:1px solid #466787; border-left:0; border-right:0; border-radius:0; background:#152230; isolation:isolate; }
    body:has(#setupPanel:not([hidden])) .camera-viewport { height:100px; aspect-ratio:auto; }
    .camera-zoom { min-width:0; margin:5px 0 0; padding:3px 6px 0; border:1px solid var(--line); border-radius:6px; background:#fff; }
    .camera-zoom-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-width:0; }
    .camera-zoom-value { flex:1 1 80px; min-width:0; font-size:11px; color:var(--muted); overflow-wrap:anywhere; }
    .camera-zoom-presets { display:flex; flex:0 1 auto; flex-wrap:wrap; max-width:100%; gap:4px; }
    .camera-zoom-presets .btn { min-width:44px; min-height:44px; padding:5px; font-size:12px; }
    .camera-zoom-presets .btn[aria-pressed="true"] { color:var(--blue); border-color:#7baadd; background:#e8f2ff; }
    .camera-zoom input[type="range"] { display:block; width:100%; min-width:0; height:44px; margin:0; accent-color:var(--blue); }
    .camera-viewport video { position:absolute; inset:0; display:block; width:100%; height:100%; object-fit:cover; object-position:center; z-index:0; }
    .camera-line { position:absolute; top:50%; left:3%; right:3%; height:1px; transform:translateY(-50%); background:#ff3545; pointer-events:none; z-index:2; }
    .camera-placeholder { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; margin:0; padding:0 8px 8px; background:#152230; color:#d9e4f1; font-size:11px; text-align:center; z-index:1; }
    .camera-state { position:absolute; top:5px; left:6px; max-width:calc(100% - 12px); padding:2px 5px; border-radius:3px; background:rgba(0,0,0,.6); color:#fff; font-size:10px; z-index:3; pointer-events:none; overflow-wrap:anywhere; }
    .camera-hint { margin:4px 2px 0; min-height:14px; color:var(--muted); font-size:10px; line-height:1.4; overflow-wrap:anywhere; }
    .camera-hint.problem { color:#a42b37; }
    .camera-options { margin:5px 0 0; border:1px solid var(--line); border-radius:6px; background:#fff; }
    .camera-options summary { min-height:44px; padding:12px 8px; cursor:pointer; color:var(--navy); font-weight:650; }
    .camera-options-body { padding:0 8px 8px; }
    .camera-options-body p { margin:4px 0 8px; font-size:11px; overflow-wrap:anywhere; }
    .camera-setting { display:grid; grid-template-columns:74px minmax(0,1fr); align-items:center; gap:6px; margin:5px 0; min-width:0; }
    .camera-setting select { width:100%; min-width:0; min-height:44px; padding:6px; border:1px solid #bacbdc; border-radius:5px; background:#fff; color:var(--ink); font-size:16px; }
    .camera-range-label { display:flex; justify-content:space-between; gap:8px; margin:7px 0 0; }
    .camera-options input[type="range"] { display:block; width:100%; min-width:0; height:44px; margin:0; accent-color:var(--blue); }
    .camera-control-buttons { display:flex; gap:6px; margin-top:5px; }
    .camera-control-buttons > button { flex:1; }
    .camera-control-status { color:var(--muted); }
    .camera-control-status:empty { display:none; }
    .btn { min-width:0; min-height:44px; padding:7px 8px; border:1px solid #bacbdc; border-radius:6px; background:#fff; color:var(--navy); font-weight:700; line-height:1.3; }
    .primary { border-color:var(--blue); background:var(--blue); color:#fff; font-size:14px; }
    .primary:hover { background:#034e9d; }
    .secondary { background:#edf4fc; border-color:#bed1e6; color:var(--navy); }
    .subtle { background:#fff; border-color:#ccd7e3; color:var(--muted); font-size:12px; }
    .danger { color:#a82e3b; border-color:#e4b5bc; }
    .setup-top { display:grid; grid-template-columns:76px minmax(0,1fr); align-items:end; gap:8px; }
    .store-label { display:block; margin-bottom:3px; color:var(--muted); font-size:11px; font-weight:650; }
    .presets { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
    .preset { font-size:11px; }
    .preset[aria-pressed="true"] { color:var(--blue); background:#e8f2ff; border-color:#7baadd; }
    .field-choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; margin:8px 0 0; padding:0; border:0; }
    .field-choice { display:flex; align-items:center; gap:6px; min-height:40px; padding:5px 6px; border:1px solid #d1dce8; border-radius:5px; font-size:11px; line-height:1.35; }
    .field-choice:has(input:checked) { border-color:#9bbde2; background:#f3f8ff; }
    .field-choice span { min-width:0; overflow-wrap:anywhere; }
    .mode-settings { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:3px 8px; margin:8px 0 0; padding:0; border:0; }
    .mode-label { color:var(--muted); font-size:11px; }
    .mode-options { display:flex; gap:8px; }
    .mode-options label { display:flex; align-items:center; gap:5px; min-height:40px; font-size:11px; }
    .selection-status { margin:4px 0 0; color:var(--muted); font-size:11px; line-height:1.4; overflow-wrap:anywhere; }
    .error { margin:6px 0 0; padding:6px 8px; border:1px solid #e9aeb4; border-radius:5px; color:#9f2632; background:#fff1f1; font-size:11px; overflow-wrap:anywhere; }
    .session-summary { margin:0 0 5px; color:var(--muted); font-size:10px; overflow-wrap:anywhere; }
    .work-title { margin:0; color:var(--navy); font-size:16px; line-height:1.4; }
    .active-jan { margin:5px 0 0; color:var(--ink); font-size:23px; font-weight:750; line-height:1.3; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .active-jan:empty { display:none; }
    .work-hint { margin:5px 0 0; color:var(--muted); font-size:11px; overflow-wrap:anywhere; }
    .result-panel { border-color:#c5dbf1; background:#f2f7ff; }
    .result-row { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
    .result-title { margin:0; color:var(--navy); font-size:12px; font-weight:650; }
    .result-value { margin:0; color:var(--navy); font-size:28px; font-weight:750; line-height:1.25; text-align:right; overflow-wrap:anywhere; }
    .result-value.plus { color:var(--red); }
    .result-value.minus { color:var(--blue); }
    .result-value.zero { color:var(--green); }
    .result-explanation { margin:4px 0 0; color:var(--muted); font-size:11px; line-height:1.4; overflow-wrap:anywhere; }
    .review-list { margin-top:8px; border-top:1px solid #d4e1ef; }
    .review-list > div,.review-row,.review-list dl > div { display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px solid #dce6f1; font-size:11px; overflow-wrap:anywhere; }
    .review-list > div > :first-child { color:var(--muted); }
    .review-list > div > :last-child { font-weight:650; text-align:right; }
    .review-list dl { margin:0; }
    .review-list dt { color:var(--muted); }
    .review-list dd { margin:0; font-weight:650; text-align:right; overflow-wrap:anywhere; }
    .record-meta { margin:6px 0 0; color:var(--muted); font-size:10px; line-height:1.4; overflow-wrap:anywhere; }
    .submission-status { margin:6px 2px 0; color:var(--muted); font-size:11px; line-height:1.4; overflow-wrap:anywhere; }
    .submission-status:empty { display:none; }
    .submission-status.problem { color:#a42b37; }
    .submission-status.success { color:var(--green); }
    .submission-status a { color:var(--blue); text-decoration:underline; text-underline-offset:2px; }
    .action-dock { position:fixed; left:0; right:0; bottom:0; z-index:20; display:grid; gap:6px; width:100%; max-width:500px; margin:0 auto; padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); border-top:1px solid var(--line); background:rgba(243,246,250,.98); box-shadow:0 -3px 12px rgba(24,68,111,.08); }
    .action-dock > .btn { min-height:48px; }
    .action-group { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
    .action-group > .btn { min-height:48px; }
    .scan-actions { grid-template-columns:minmax(0,1fr); }
    .review-actions { grid-template-columns:minmax(0,1.4fr) minmax(50px,.7fr) minmax(0,1.2fr); }
    .review-actions > .btn:not(.primary) { font-size:11px; }
    .review-actions .next-after-check { grid-column:1 / -1; }
    .common-actions { display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .common-actions .btn { flex:1; min-height:44px; font-size:11px; }
    .wizard-sheet { position:fixed; inset:auto 6px 6px; width:calc(100% - 12px); max-width:460px; max-height:calc(100vh - 12px); max-height:calc(100dvh - 12px); margin:0 auto; padding:8px 10px max(8px,env(safe-area-inset-bottom)); overflow:auto; border:1px solid #cbd7e5; border-radius:14px; background:#fff; color:var(--ink); box-shadow:0 8px 36px rgba(10,29,48,.28); overscroll-behavior:contain; }
    .wizard-sheet[open] { display:flex; flex-direction:column; }
    .wizard-sheet::backdrop { background:rgba(16,32,49,.46); }
    .wizard-head { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; margin-bottom:4px; }
    .wizard-head-info { min-width:0; }
    .wizard-progress { color:var(--muted); font-size:11px; font-weight:650; }
    .wizard-context { margin:1px 0 0; color:var(--muted); font-size:10px; line-height:1.3; overflow-wrap:anywhere; }
    .wizard-context:empty { display:none; }
    .wizard-close { min-height:44px; min-width:64px; padding:6px 8px; border:1px solid #ccd8e5; border-radius:6px; color:var(--muted); background:#fff; font-size:12px; }
    .wizard-content { flex:1 1 auto; min-height:0; overflow:auto; overscroll-behavior:contain; }
    .wizard-title { margin:0; color:var(--navy); font-size:18px; line-height:1.25; overflow-wrap:anywhere; }
    .wizard-hint { min-height:14px; margin:2px 0 6px; color:var(--muted); font-size:11px; line-height:1.3; overflow-wrap:anywhere; }
    .wizard-value-row { display:grid; grid-template-columns:minmax(0,1fr) 64px; gap:6px; }
    input.wizard-value { height:48px; padding:4px 10px; background:#f5f9ff; border-color:#7baadd; font-size:28px; font-weight:700; text-align:right; letter-spacing:.01em; }
    .wizard-clear { min-height:48px; padding:6px 4px; border:1px solid #ccd8e5; border-radius:6px; color:var(--ink); background:#f5f7fa; font-size:12px; }
    .wizard-error { margin:5px 0 0; padding:5px 7px; border-radius:4px; color:#9f2632; background:#fff1f1; font-size:11px; line-height:1.35; overflow-wrap:anywhere; }
    .wizard-keypad { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:6px; }
    .key { min-height:44px; padding:5px 6px; border:1px solid #cbd7e5; border-radius:7px; background:#f7f9fc; color:var(--ink); font-size:23px; font-weight:650; line-height:1.2; }
    .key:active { background:#dceafb; }
    .key:disabled { color:#8b98a7; opacity:.35; }
    .key.utility { font-size:18px; }
    .wizard-actions { flex:0 0 auto; display:grid; grid-template-columns:minmax(72px,1fr) minmax(0,2fr); gap:8px; padding-top:6px; }
    .wizard-actions .btn { min-height:44px; }
    .wizard-back { background:#fff; border-color:#bccbdb; color:var(--ink); font-size:13px; }
    .resume-result-actions { grid-template-columns:minmax(0,1fr); }
    .result-context { min-width:0; margin:0; color:var(--muted); font-size:11px; line-height:1.4; overflow-wrap:anywhere; }
    .result-sheet .result-panel { margin:0; padding:10px; }
    .result-sheet .review-actions { flex:0 0 auto; margin-top:8px; }
    .result-content .submission-status { margin:8px 2px 2px; }
    @media(max-width:350px) { .setup-top { grid-template-columns:68px minmax(0,1fr); gap:6px; } .preset { padding-left:4px; padding-right:4px; font-size:10px; } .field-choice { gap:5px; padding-left:5px; padding-right:5px; font-size:10px; } .mode-options { gap:6px; } .action-dock .primary { font-size:12px; } }
  </style>
</head>
<body>
  <section id="cameraPanel" aria-label="JAN読み取りカメラ">
    <div id="cameraViewport" class="camera-viewport">
      <video id="janVideo" autoplay muted playsinline webkit-playsinline disablepictureinpicture disableremoteplayback aria-label="JAN読み取り用のカメラ映像"></video>
      <p id="cameraPlaceholder" class="camera-placeholder">カメラを準備しています</p>
      <div class="camera-line" aria-hidden="true"></div>
      <span id="cameraState" class="camera-state">準備中</span>
    </div>
    <div id="cameraZoomRow" class="camera-zoom" hidden>
      <div class="camera-zoom-head">
        <span class="camera-zoom-value">ズーム <span id="cameraZoomValue">倍率未確認</span></span>
        <div class="camera-zoom-presets" role="group" aria-label="ズーム倍率">
          <button type="button" id="cameraZoom1" class="btn" aria-pressed="false" disabled>1×</button>
          <button type="button" id="cameraZoom15" class="btn" aria-pressed="false" disabled>1.5×</button>
          <button type="button" id="cameraZoom2" class="btn" aria-pressed="false" disabled>2×</button>
        </div>
      </div>
      <label class="sr-only" for="cameraZoom">カメラのズーム倍率</label>
      <input type="range" id="cameraZoom" min="1" max="3" step="0.1" value="1" disabled>
    </div>
    <p id="cameraHint" class="camera-hint" role="status"></p>
    <details id="cameraOptions" class="camera-options" hidden>
      <summary>ピント・カメラ調整</summary>
      <div class="camera-options-body">
        <p id="cameraInfo"></p>
        <p id="decoderInfo" class="camera-control-status"></p>
        <p>調整を閉じると読み取り再開。ぼける時は少し離し、バーコード左右の白い余白も枠内に入れてください。</p>
        <label class="camera-setting" id="cameraDeviceRow"><span>カメラ</span><select id="cameraDevice"><option value="">背面（自動）</option></select></label>
        <label class="camera-setting"><span>解像度</span><select id="cameraQuality"><option value="standard">標準（フルHD優先）</option><option value="high">細部優先（4K優先）</option></select></label>
        <div id="cameraManualFocusRow" hidden>
          <label class="camera-range-label" for="cameraManualFocus"><span>手動ピント</span><span id="cameraFocusValue"></span></label>
          <input type="range" id="cameraManualFocus" min="0" max="1" step="0.01" value="0">
        </div>
        <div class="camera-control-buttons">
          <button type="button" id="cameraFocus" class="btn secondary" hidden>自動ピント</button>
          <button type="button" id="cameraTorch" class="btn" aria-pressed="false" hidden>ライト OFF</button>
        </div>
        <p id="cameraControlStatus" class="camera-control-status" role="status"></p>
      </div>
    </details>
    <canvas id="janCanvas" hidden></canvas>
  </section>

<main class="shell">
  <section id="setupPanel" class="panel" aria-label="入力項目の設定">
    <div class="setup-top">
      <div>
        <label for="storeCode" class="store-label">店番</label>
        <input type="text" id="storeCode" name="storeCode" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="店番" required>
      </div>
      <div class="presets" role="group" aria-label="入力項目のセット">
        <button type="button" id="presetHht" class="btn preset" aria-pressed="true">HHT計算</button>
        <button type="button" id="presetQuantity" class="btn preset" aria-pressed="false">JAN＋在庫</button>
      </div>
    </div>
    <fieldset class="field-choices">
      <legend class="sr-only">入力する項目を選択</legend>
      <label class="field-choice" for="choose-minDisplay"><input type="checkbox" name="collectField" id="choose-minDisplay" value="minDisplay" data-field="minDisplay" checked><span>最低陳列量</span></label>
      <label class="field-choice" for="choose-orderUnit"><input type="checkbox" name="collectField" id="choose-orderUnit" value="orderUnit" data-field="orderUnit" checked><span>発注単位</span></label>
      <label class="field-choice" for="choose-maxLTSales"><input type="checkbox" name="collectField" id="choose-maxLTSales" value="maxLTSales" data-field="maxLTSales" checked><span>LT中の想定最大販売数</span></label>
      <label class="field-choice" for="choose-salesFloorStock"><input type="checkbox" name="collectField" id="choose-salesFloorStock" value="salesFloorStock" data-field="salesFloorStock" checked><span>売場在庫</span></label>
      <label class="field-choice" for="choose-backroomStock"><input type="checkbox" name="collectField" id="choose-backroomStock" value="backroomStock" data-field="backroomStock" checked><span>BR在庫</span></label>
      <label class="field-choice" for="choose-accumulated"><input type="checkbox" name="collectField" id="choose-accumulated" value="accumulated" data-field="accumulated" checked><span>累積値・未納品</span></label>
      <label class="field-choice" for="choose-recordQuantity"><input type="checkbox" name="collectField" id="choose-recordQuantity" value="recordQuantity" data-field="recordQuantity"><span>在庫合計（売場＋BR）</span></label>
    </fieldset>
    <div id="modeSettings" class="mode-settings">
      <span class="mode-label" id="modeLabel">累積値・未納品の入力</span>
      <div class="mode-options" role="radiogroup" aria-labelledby="modeLabel">
        <label><input type="radio" id="modeCombined" name="inputMode" value="combined" checked>合計</label>
        <label><input type="radio" id="modeSeparate" name="inputMode" value="separate">別々</label>
      </div>
    </div>
    <p id="selectionStatus" class="selection-status" role="status"></p>
    <p id="setupError" class="error" role="alert" hidden></p>
  </section>

  <section id="workPanel" class="panel" aria-labelledby="workTitle" hidden>
    <p id="sessionSummary" class="session-summary"></p>
    <h2 id="workTitle" class="work-title">JANを読み取ってください</h2>
    <p id="activeJan" class="active-jan"></p>
    <p id="workHint" class="work-hint"></p>
  </section>

  <p id="submissionStatus" class="submission-status" role="status" aria-live="polite"></p>
  <noscript><p class="error">このツールを使うには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
</main>

<nav id="actionDock" class="action-dock" aria-label="サンプリングの操作">
  <button type="button" id="beginSession" class="btn primary">開始・カメラ起動</button>
  <div id="scanActions" class="action-group scan-actions" hidden>
    <button type="button" id="manualJan" class="btn secondary" aria-haspopup="dialog" aria-controls="inputWizard">JANを手入力</button>
  </div>
  <div id="draftActions" class="action-group" hidden>
    <button type="button" id="resumeInput" class="btn primary" aria-haspopup="dialog" aria-controls="inputWizard">入力を再開</button>
    <button type="button" id="discardDraft" class="btn subtle danger">破棄して次へ</button>
  </div>
  <div id="resumeResultActions" class="action-group resume-result-actions" hidden>
    <button type="button" id="resumeResult" class="btn primary" aria-haspopup="dialog" aria-controls="resultDialog">結果に戻る</button>
  </div>
  <div id="commonActions" class="common-actions">
    <button type="button" id="cameraToggle" class="btn subtle" aria-controls="janVideo">カメラを停止</button>
    <button type="button" id="settingsButton" class="btn subtle" hidden>設定変更</button>
  </div>
</nav>

<dialog id="resultDialog" class="wizard-sheet result-sheet" aria-labelledby="resultTitle">
  <div class="wizard-head">
    <p id="resultContext" class="result-context"></p>
    <button type="button" id="resultClose" class="wizard-close">中断</button>
  </div>
  <div class="wizard-content result-content">
    <section id="resultPanel" class="panel result-panel" aria-labelledby="resultTitle" hidden>
      <div class="result-row" aria-live="polite" aria-atomic="true">
        <h2 id="resultTitle" class="result-title">HHT入力値</h2>
        <p id="resultValue" class="result-value"></p>
      </div>
      <p id="resultExplanation" class="result-explanation"></p>
      <div id="reviewList" class="review-list"></div>
      <p id="recordMeta" class="record-meta"></p>
    </section>

<script>

function makeRecordId() {

function normalizeJan(value) {
  return String(value).trim().replace(/[０-９]/g, character => String(character.charCodeAt(0) - 0xFF10));
}

function isValidJan(value) {
  if (!/^(?:\d{8}|\d{13})$/.test(value) || /^0+$/.test(value)) return false;
  let sum = 0;
  for (let i = value.length - 2, weight = 3; i >= 0; i--, weight = weight === 3 ? 1 : 3) {
    sum += Number(value[i]) * weight;
  }
  return (10 - sum % 10) % 10 === Number(value[value.length - 1]);
}

async function switchJanCamera() {

function setJanStatus(message, problem = false) {

function updateCameraUI() {

  el('decoderInfo').textContent = '読取：' + (janScanner.active ? engineLabel : '停止中') + ' ／ ' + APP_VERSION.replace('ordering-sampling-','v');

        input:'入力中はバーコードの読み取りを止めています。',

        review:'内容を確認して記録してください。',

    phase === 'ready' && !sending && !document.hidden && !el('cameraOptions').open &&

  janScanner.ready = false;

  clearTimeout(janScanner.timer);
  janScanner.timer = null;

  janScanner.stream = null;

  janScanner.message = message;
  janScanner.problem = problem;

        if (!Array.isArray(found)) throw {name:'JanNativeResultError'};
        const relevant = found.filter(item => decoder.formats.includes(item.format));
        const located = relevant.map(item => ({item,box:janNativeBounds(item)}));
        if (located.some(value => !value.box)) {
          // Unknown locations cannot be accepted from the full camera image:
          // use the same detector on the visible crop before accepting digits.
          found = null;
        } else found = located.filter(value => janNativeInPreview(value.box,geometry)).map(value => value.item);
      } catch (error) {
        if (!current(true)) return [];
        // A frame can briefly disappear while the camera is still healthy.
        // Keep the direct path for the next fresh frame in that case.
        if (error && error.name === 'InvalidStateError') return [];
        found = null;
      }
    }
    if (found === null) {
      const input = getCanvas();
      if (!input) return [];
      try {
        found = await decoder.detector.detect(input);
        if (!current(!!video)) return [];
        if (!Array.isArray(found)) throw {name:'JanNativeResultError'};
        if (video && decoder.nativeInput !== 'canvas') {
          decoder.nativeInput = 'canvas';
          notifyJanDecoderChanged(decoder);
        }
      } catch (error) {
        if (!current(!!video)) return [];
        if (error && error.name === 'InvalidStateError') return [];
        found = null;
        decoder.detector = null;
        notifyJanDecoderChanged(decoder);
      }
    }
    if (found) {
      const relevant = found.filter(item => decoder.formats.includes(item.format));
      const codes = collectDecodedJan(decoder,relevant.map(item => item.rawValue));
      if (codes.length) {
        // New native evidence supersedes any older worker image, including an
        // ambiguous native result. Native EAN also needs exact length/checksum.
        invalidateJanDecoderResults(decoder);
        decoder.lastReadStrong = codes.length === 1 && relevant.some(item => {
          const code = normalizeJan(item.rawValue);
          return code === codes[0] && isValidJan(code) &&
            ((item.format === 'ean_8' && /^\d{8}$/.test(code)) ||
             (item.format === 'ean_13' && /^\d{13}$/.test(code)));
        });
        return codes;
      }
    }
  }
  if (!current()) return [];
  if (decoder.wasmReady) {
    if (decoder.detector) {
      // Native sees each fresh frame. Finished assistance can be consumed at
      // any time; the cadence limits new pixel copies, not result delivery.
      const ready = takeJanWasmResult(decoder,dimensions,context,true);
      if (ready && ready.codes.length) {
        decoder.lastReadStrong = ready.strong;
        decoder.diagnostic = ready.diagnostic || decoder.diagnostic;
        return ready.codes;
      }
      if (ready) decoder.diagnostic = ready.diagnostic || decoder.diagnostic;
      if (!decoder.wasmTask && janAssistDue(decoder)) {
        const input = getCanvas();
        if (!input) return [];
        decoder.lastAssistAt = Date.now();
        startJanWasmRead(decoder,input,context);
      }
      return [];
    }
    // Without native support, use the bounded awaited worker path without the
    // assist cadence. An old owned task must settle before a fresh copy starts.
    const existing = decoder.wasmTask;
    if (existing) await existing.promise;
    if (!current()) return [];
    let ready = takeJanWasmResult(decoder,dimensions,context,true);
    if (existing && !ready && decoder.wasmReady) return [];
    if (!ready && decoder.wasmReady) {
      const input = getCanvas();
      if (!input) return [];
      const task = startJanWasmRead(decoder,input,context);
      if (task) await task.promise;
      if (!current()) return [];
      ready = takeJanWasmResult(decoder,dimensions,context,false);
    }
    if (ready) {
      decoder.lastReadStrong = ready.strong;
      decoder.diagnostic = ready.diagnostic || decoder.diagnostic;
      return ready.codes;
    }
  }
  if (decoder.wasmFailed) {
    if (decoder.detector && !decoder.legacy) {
      ensureJanLegacy(decoder).catch(() => {
        if (!decoder.disposed) { decoder.legacyFailed = true; notifyJanDecoderChanged(decoder); }
      });
      if (!decoder.diagnostic && !decoder.legacyFailed) decoder.diagnostic = '補助の読み取りを準備しています。カメラはそのまま使えます。';
      return [];
    }
    if (decoder.detector && !janAssistDue(decoder)) return [];
    try {
      const legacy = await ensureJanLegacy(decoder);
      if (!current() || !legacy) return [];
      const input = getCanvas();
      if (!input) return [];
      if (decoder.detector) decoder.lastAssistAt = Date.now();
      const codes = await decodeLegacyJanCanvas(legacy,input);
      if (!current()) return [];
      decoder.diagnostic = legacy.diagnostic || decoder.diagnostic;
      return codes;
    } catch (_) {
      if (!current()) return [];
      if (!decoder.detector) throw {name:'JanLibraryError'};
    }
  } else if (!decoder.diagnostic) {
    decoder.diagnostic = '補助の読み取りを準備しています。映像はそのまま使えます。';
  }
  return [];
}

async function createLegacyJanDecoder() {
  const Z = await loadZxing();
  const eanFormats = [Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8];
  const allFormats = [...eanFormats,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF];
  const makeReader = formats => {
    const hints = new Map([[Z.DecodeHintType.POSSIBLE_FORMATS,formats],[Z.DecodeHintType.TRY_HARDER,true]]);
    const reader = new Z.MultiFormatReader();
    reader.setHints(hints);
    return reader;
  };
  return {kind:'zxing',Z,reader:makeReader(eanFormats),labelReader:makeReader(allFormats),
    allFormats,variant:0,disposed:false,diagnostic:''};
}

function collectDecodedJan(decoder, values) {
  const accepted = [];
  for (const value of values) {
    const code = normalizeJan(value);
    // A price-card symbol may contain an internal ID instead of JAN.
    // Never extract a substring, invent a missing digit, or accept UPC-E as JAN-8.
    if (isValidJan(code)) accepted.push(code);
    else decoder.diagnostic = 'バーコードは読めましたが、JANの桁数・チェックが一致しません。カードのJANを確認してください。';
  }
  return [...new Set(accepted)];
}

function janVariantSource(Z, source, variant) {
  if (variant === 0) return source;
  if (variant === 2) return source.invert();
  const rotate = variant === 4;
  // This source changes only the luminance interpretation, never the digits.
  // Rotation is a separate bounded pass; no repeated canvas reads/resizes.
  const transformed = new class extends Z.LuminanceSource {
    constructor() { super(rotate ? source.getHeight() : source.getWidth(),rotate ? source.getWidth() : source.getHeight()); }
    getRow(y,row) {
      const width = this.getWidth();
      if (!row || row.length < width) row = new Uint8ClampedArray(width);
      if (rotate) {
        const pixels = source.getMatrix(), originalWidth = source.getWidth();
        for (let x = 0; x < width; x++) row[x] = pixels[x * originalWidth + originalWidth - 1 - y];
      } else {
        row = source.getRow(y,row);
        let low = 255, high = 0;
        for (let x = 0; x < width; x++) { low = Math.min(low,row[x]); high = Math.max(high,row[x]); }
        // Avoid amplifying almost-flat sensor noise into high-contrast stripes.
        if (high - low >= 12 && high - low < 220) {
          const scale = 255 / (high - low);
          for (let x = 0; x < width; x++) row[x] = Math.round((row[x] - low) * scale);
        }
      }
      return row;
    }
    getMatrix() {
      const width = this.getWidth(), height = this.getHeight();
      const matrix = new Uint8ClampedArray(width * height);
      let row = null;
      for (let y = 0; y < height; y++) { row = this.getRow(y,row); matrix.set(row.subarray(0,width),y * width); }
      return matrix;
    }
    invert() { return new Z.InvertedLuminanceSource(this); }
  }();
  return variant === 3 ? transformed.invert() : transformed;
}

function tryJanZxing(decoder, reader, source) {
  const {Z} = decoder;
  try {
    // For one-dimensional codes, Hybrid and GlobalHistogram share getBlackRow.
    // A second binarizer of the same kind adds no useful decoding attempt.
    const bitmap = new Z.BinaryBitmap(new Z.GlobalHistogramBinarizer(source));
    const result = reader.decodeWithState(bitmap);
    return decoder.allFormats.includes(result.getBarcodeFormat()) ? collectDecodedJan(decoder,[result.getText()]) : [];
  } catch (error) {
    if (error instanceof Z.NotFoundException || error instanceof Z.ChecksumException || error instanceof Z.FormatException) return [];
    throw error;
  } finally { reader.reset(); }
}


async function decodeLegacyJanCanvas(decoder,canvas) {
  if (!decoder || decoder.disposed) return [];
  decoder.diagnostic = "";
  const {Z} = decoder;
  const luminance = new Z.HTMLCanvasElementLuminanceSource(canvas).getMatrix();
  // Retain the source pixels. Do not let a failed pass mutate or rotate them.
  const source = new Z.RGBLuminanceSource(luminance,canvas.width,canvas.height);
  // First search for actual EAN throughout the visible area, so a nearby
  // non-JAN label cannot hide a readable EAN on another scanline.
  const ean = tryJanZxing(decoder,decoder.reader,source);
  if (ean.length) return ean;
  // At most one extra pass per frame. Keep a successful variant for the next
  // fresh frame so the two-frame validation can complete without a gap.
  const extra = tryJanZxing(decoder,decoder.labelReader,janVariantSource(Z,source,decoder.variant));
  if (!extra.length) decoder.variant = (decoder.variant + 1) % 5;
  return extra;
}

function getJanFrameGeometry(video = el('janVideo')) {
  const viewport = el('cameraViewport');
  const viewportWidth = viewport.clientWidth, viewportHeight = viewport.clientHeight;
  const ratio = viewportWidth && viewportHeight ? viewportWidth / viewportHeight : 3.5;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (![vw,vh,ratio].every(Number.isFinite) || vw <= 0 || vh <= 0 || ratio <= 0) throw {name:'JanCaptureError'};
  // The native engine sees the full video. This rectangle identifies what the
  // user sees in the centered object-fit:cover preview and gates acceptance.
  const sw = Math.min(vw,vh * ratio), sh = sw / ratio;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  const scale = Math.min(1,3840 / sw,2160 / sh);
  const width = Math.max(1,Math.floor(sw * scale)), height = Math.max(1,Math.floor(sh * scale));
  return {videoWidth:vw,videoHeight:vh,viewportWidth,viewportHeight,sx,sy,sw,sh,width,height,
    key:[vw,vh,viewportWidth,viewportHeight,sx,sy,sw,sh,width,height].join(':')};
}

function sameJanFrameGeometry(geometry,video = el('janVideo')) {
  try { return !!geometry && geometry.key === getJanFrameGeometry(video).key; }
  catch (_) { return false; }
}

function captureJanFrame(geometry = null) {
  const video = el('janVideo'), canvas = el('janCanvas');
  const frame = geometry || getJanFrameGeometry(video);
  const {sx,sy,sw,sh,width,height} = frame;
  // Software fallback retains the source pixels of the whole visible preview.
  // Never enlarge input; enlargement cannot restore missing barcode detail.
  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== height) canvas.height = height;
  const context = canvas.getContext('2d',{willReadFrequently:true});
  if (!context) throw {name:'JanCaptureError'};
  context.imageSmoothingEnabled = false;
  context.drawImage(video,sx,sy,sw,sh,0,0,width,height);
  return canvas;
}

function notifyJanScanAccepted() {
  // Called once only after a camera JAN has successfully created its sample.
  // Unsupported or denied vibration must never interrupt input or scanning.
  try {
    if (typeof navigator.vibrate === 'function') navigator.vibrate(80);
  } catch (_) {}
}

async function readJanFrame(token, epoch) {
  if (!canReadJan(token,epoch)) return;
  // An old epoch may still have detect() in flight. Do not use the same reader
  // and canvas concurrently; a new camera generation uses a new decoder.
  if (janScanner.readingTask && janScanner.readingTask.generation === token) {
    scheduleJanFrame(token,epoch,80);
    return;
  }
  const task = {generation:token,epoch,startedAt:Date.now()};
  janScanner.readingTask = task;
  const video = el('janVideo');
  try {
    if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0 && video.currentTime !== janScanner.lastFrameTime) {
      janScanner.lastFrameTime = video.currentTime;
      janScanner.lastFrameAt = Date.now();
      const frameContext = {generation:token,epoch,capturedAt:Date.now()};
      let decoder = janScanner.decoder;
      let codes;
      try { codes = await decodeJanCanvas(decoder,null,frameContext,video); }
      catch (error) {
        if (!canReadJan(token,epoch)) return;
        if (decoder.kind !== 'native') throw error;
        setJanStatus('互換用の読み取り機能を準備しています。');
        const fallback = await createJanDecoder(false);
        if (!canReadJan(token,epoch)) { disposeJanDecoder(fallback); return; }
        disposeJanDecoder(decoder);
        janScanner.decoder = fallback;
        decoder = fallback;
        clearJanStreak();
        setJanStatus('');
        codes = await decodeJanCanvas(decoder,null,frameContext,video);
      }
      if (!canReadJan(token,epoch)) return;
      const unique = [...new Set(codes.map(normalizeJanForRecord).filter(Boolean))];
      const now = Date.now();
      if (unique.length === 1) {
        const code = unique[0];
        janScanner.scanHint = '';
        janScanner.streak = code === janScanner.previousCode && now - janScanner.previousAt <= 2500 ? janScanner.streak + 1 : 1;
        janScanner.previousCode = code;
        janScanner.previousAt = now;
        // Qualified native EAN and WASM multi-scanline evidence can be accepted
        // once. Other native formats and legacy reads need two observations.
        if (decoder.lastReadStrong === true || janScanner.streak >= 2) {
          clearJanStreak();
          // startSample owns the sample ID and phase change.
          // It calls resetJanReading when the input dialog is opened.
          const started = startSample(code);
          if (started === true) notifyJanScanAccepted();
          else if (canReadJan(token,epoch)) {
            janScanner.scanHint = '入力を開始できませんでした。画面の案内を確認してください。';
          }
        }
      } else {
        // Intermittent misses do not discard a recent checksum-valid hit.
        // Ambiguity, expiry and all input/camera lifecycle changes still reset it.
        if (unique.length > 1 || now - janScanner.previousAt > 2500) clearJanStreak();
        janScanner.scanHint = unique.length > 1 ? 'バーコードを1つだけ枠内に入れてください。' : (decoder.diagnostic || '');
      }
      updateCameraUI();
    } else if (Date.now() - janScanner.lastFrameAt > 15000) {
      throw {name:'JanCaptureError'};
    }
  } catch (error) {
    if (canReadJan(token,epoch)) {
      janScanner.blocked = true;
      stopJanCamera(cameraErrorText(error),true);
    }
  } finally {
    if (janScanner.readingTask === task) janScanner.readingTask = null;
    scheduleJanFrame(token,epoch,Math.max(20,70 - (Date.now() - task.startedAt)));
  }
}

function cameraErrorText(error) {
  switch (error && error.name) {
    case 'JanSecureError': return 'HTTPSの公開ページでカメラを利用してください。JANの手入力も利用できます。';
    case 'JanPolicyError': return '埋め込み画面ではカメラが許可されていません。公開URLをブラウザで直接開くか、JANを手入力してください。';
    case 'JanUnavailableError': return 'この画面ではカメラを利用できません。公開URLをChromeやSafariで開くか、JANを手入力してください。';
    case 'JanAutoplayError': return '映像を自動で開始できません。「カメラ再試行」を押すか、JANを手入力してください。';
    case 'NotAllowedError': case 'PermissionDeniedError': case 'SecurityError': return 'カメラが許可されていません。サイトのカメラ設定を確認し「カメラ再試行」を押すか、JANを手入力してください。';
    case 'NotFoundError': case 'DevicesNotFoundError': return '利用できるカメラが見つかりません。JANを手入力してください。';
    case 'NotReadableError': case 'TrackStartError': return 'カメラを開始できません。ほかのカメラアプリを閉じて再試行するか、JANを手入力してください。';
    case 'OverconstrainedError': return 'この端末ではカメラの条件を満たせません。別のブラウザで開くか、JANを手入力してください。';
    case 'JanLibraryError': return '読み取り機能を読み込めません。通信環境を確認して再試行するか、JANを手入力してください。';
    case 'JanCaptureError': return 'カメラ映像を取得できません。カメラを再試行するか、JANを手入力してください。';
    default: return '読み取りを続けられません。カメラを再試行するか、JANを手入力してください。';
  }
}

function mayRestartJanCamera() {
  if (!janScanner.restartRequested || janScanner.pending || janScanner.active ||
      janScanner.userPaused || janScanner.blocked || document.hidden) return;
  janScanner.restartRequested = false;
  void startJanCamera(false);
}

async function startJanCamera(manual = false) {
  if ((manual && sending) || document.hidden || janScanner.userPaused || janScanner.active) return;
  if (!manual && janScanner.blocked) { updateCameraUI(); return; }
  if (manual) janScanner.blocked = false;
  if (janScanner.pending) {
    janScanner.restartRequested = true;
    setJanStatus('先に開いたカメラの許可確認を待っています。JANの手入力も利用できます。');
    return;
  }
  stopJanCamera();
  const token = janScanner.generation;
  janScanner.active = true;
  janScanner.startedAt = Date.now();
  janScanner.lastFrameAt = janScanner.startedAt;
  janScanner.lastFrameTime = -1;
  setJanStatus('カメラを準備しています。確認が出たら許可してください。JANの手入力も利用できます。');
  let request = null;
  try {
    if (!window.isSecureContext) throw {name:'JanSecureError'};
    const policy = document.permissionsPolicy || document.featurePolicy;
    if (policy && typeof policy.allowsFeature === 'function' && !policy.allowsFeature('camera')) throw {name:'JanPolicyError'};
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw {name:'JanUnavailableError'};
    const videoConstraints = getJanVideoConstraints();
    request = navigator.mediaDevices.getUserMedia({audio:false,video:videoConstraints});
    janScanner.pending = request;
    updateCameraUI();
    let stream;
    try { stream = await request; }
    finally { if (janScanner.pending === request) janScanner.pending = null; }
    if (!janScanner.active || token !== janScanner.generation || document.hidden) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    janScanner.stream = stream;
    stream.getVideoTracks().forEach(track => track.addEventListener('ended',() => {
      // A late ended event from an old stream must not stop its replacement.
      if (janScanner.stream === stream && janScanner.active) {
        janScanner.blocked = true;
        stopJanCamera('カメラが停止しました。「カメラ再試行」で再開できます。',true);
      }
    }));
    const video = el('janVideo');
    video.muted = true;
    video.playsInline = true;
    video.srcObject = stream;
    try { await video.play(); }
    catch (error) {
      if (error && error.name === 'NotAllowedError') throw {name:'JanAutoplayError'};
      throw error;
    }
    if (!janScanner.active || token !== janScanner.generation || janScanner.stream !== stream) return;
    janScanner.ready = true;
    await configureJanTrack(stream.getVideoTracks()[0],token,videoConstraints);
    if (!janScanner.active || token !== janScanner.generation || janScanner.stream !== stream) return;
    setJanStatus('読み取り機能を準備しています。');
    const decoder = await createJanDecoder();
    if (!janScanner.active || token !== janScanner.generation || janScanner.stream !== stream) {
      disposeJanDecoder(decoder);
      return;
    }
    janScanner.decoder = decoder;
    janScanner.blocked = false;
    resetJanReading();
  } catch (error) {
    const denied = error && ['NotAllowedError','PermissionDeniedError','SecurityError'].includes(error.name);
    // A denial can arrive after a user stopped the pending request. Do not
    // immediately re-request permission merely because the page became visible.
    if (denied) {
      janScanner.blocked = true;
      janScanner.restartRequested = false;
    }
    if (token === janScanner.generation) {
      janScanner.blocked = true;
      stopJanCamera(cameraErrorText(error),true);
    } else if (denied && !janScanner.userPaused && !janScanner.active) {
      setJanStatus(cameraErrorText(error),true);
    }
  } finally {
    if (request && janScanner.pending === request) janScanner.pending = null;
    updateCameraUI();
    mayRestartJanCamera();
  }
}

function toggleJanCamera() {
  if (sending) return;
  if (janScanner.active || janScanner.restartRequested || (janScanner.pending && !janScanner.userPaused)) {
    janScanner.userPaused = true;
    stopJanCamera('カメラを停止しました。入力は続けられます。');
  } else {
    janScanner.userPaused = false;
    janScanner.blocked = false;
    void startJanCamera(true);
  }
}

el('cameraToggle').addEventListener('click',toggleJanCamera);
el('cameraOptions').addEventListener('toggle',() => { refreshCameraControls(); resetJanReading(); });
el('janVideo').addEventListener('resize',refreshCameraControls);
el('cameraDevice').addEventListener('change',() => { void switchJanCamera(); });
el('cameraQuality').addEventListener('change',() => { void switchJanCamera(); });
el('cameraFocus').addEventListener('click',() => { void requestJanFocus(); });
el('cameraZoom').addEventListener('input',event => {
  const value = quantizeJanZoom(janZoomRange(cameraControls),Number(event.target.value));
  if (value !== null) { event.target.value = String(value); el('cameraZoomValue').textContent = formatJanZoom(value) + '（選択中）'; }
});
el('cameraZoom').addEventListener('change',event => { void requestJanZoom(Number(event.target.value)); });
[[1,'cameraZoom1'],[1.5,'cameraZoom15'],[2,'cameraZoom2']].forEach(([value,id]) => {
  el(id).addEventListener('click',() => { void requestJanZoom(value); });
});
el('cameraManualFocus').addEventListener('input',event => { el('cameraFocusValue').textContent = String(Number(event.target.value)); });
el('cameraManualFocus').addEventListener('change',event => {
  if (cameraControls && janCameraRange(cameraControls.capabilities.focusDistance)) void applyJanCameraChange({focusMode:'manual',focusDistance:Number(event.target.value)},'手動ピントの設定を要求しました。');
});
el('cameraTorch').addEventListener('click',() => {
  if (cameraControls && janTorchSupported(cameraControls.capabilities)) void applyJanCameraChange({torch:el('cameraTorch').getAttribute('aria-pressed') !== 'true'},'ライト設定を要求しました。反射が増える時はOFFにしてください。');
});
document.addEventListener('visibilitychange',() => {
  if (document.hidden) stopJanCamera('画面を離れたためカメラを停止しました。');
  else if (!janScanner.userPaused && !janScanner.blocked) void startJanCamera(false);
});
window.addEventListener('pagehide',() => stopJanCamera());
window.addEventListener('pageshow',() => {
  if (!document.hidden && !janScanner.userPaused && !janScanner.blocked) void startJanCamera(false);
});

selectionChanged();
renderApp();
</script>
</body>
